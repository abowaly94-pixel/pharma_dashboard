<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaNow - نظام إدارة الصيدليات</title>
    <meta name="description" content="نظام إدارة الصيدليات الذكي - PharmaNow" />
    <meta name="author" content="PharmaNow Team" />

    <meta property="og:title" content="PharmaNow - نظام إدارة الصيدليات" />
    <meta property="og:description" content="نظام إدارة الصيدليات الذكي" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@PharmaNow" />
    
    <!-- Watermark removal script - load first -->
    <script src="/remove-watermarks.js"></script>
    
    <style>
      /* Inline CSS to hide watermarks immediately */
      [class*="lovable" i],
      [id*="lovable" i],
      [data-lovable],
      [data-watermark],
      a[href*="lovable" i] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -9999px !important;
      }
      
      body > div:not(#root):not([data-sonner-toaster]):not([data-toast-viewport]):not([id*="radix"]),
      body > iframe:not([src*="firebase"]):not([src*="google"]),
      body > a:not([id*="radix"]) {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Firebase Cloud Messaging Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then((registration) => {
            console.log('Service Worker registered successfully:', registration);
          })
          .catch((error) => {
            console.error('Service Worker registration failed:', error);
          });
      }
    </script>
  </body>
</html>
